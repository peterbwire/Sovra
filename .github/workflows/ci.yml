name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOVRA_REQUIRE_CLI_EXECUTION: '1'

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Documentation target checker regressions
        run: node scripts/test-doc-links.mjs
      - name: Repository documentation targets
        run: node scripts/check-doc-links.mjs
      - name: Reject unsafe release archive members
        run: node scripts/test-archive-member-safety.mjs
      - name: Reject unsafe Windows ZIP members before extraction
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\test-windows-archive-safety.ps1
      - name: Windows installer transaction and rollback
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\test-install-transaction.ps1 -Report target\installer\transaction-verification.json
      - name: Upload installer transaction evidence
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sovra-installer-transactions
          path: target/installer/transaction-verification.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Deterministic compiler input mutation regressions
        timeout-minutes: 2
        run: cargo test --locked --test compiler_security
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo build --locked
      - name: Documented examples and status classifications
        run: node scripts/test-example-catalog.mjs
      - name: Shared UI protocol and transport boundaries
        run: node scripts/test-ui-protocol.mjs
      - name: Native responsive component source parity
        run: node scripts/test-ui-responsive-source.mjs
      - name: Local editor through real compiler commands
        run: node scripts/test-editor.mjs
      - name: Editor workspace import boundaries
        run: node scripts/test-editor-workspace.mjs
      - name: Language server through real compiler checks
        run: node scripts/test-lsp.mjs
      - name: Package workspace LSP through real compiler overlays
        run: node scripts/test-lsp-packages.mjs
      - name: Package task preparation boundaries
        run: node scripts/test-task-targets.mjs
      - name: Checked cross-file package navigation
        run: node scripts/test-lsp-navigation.mjs
      - name: Opt-in compiler IDE symbol evidence
        run: node scripts/test-ide-symbols.mjs
      - name: Relocated developer tools and installed compiler pairing
        run: node scripts/test-developer-tools.mjs
      - name: VSIX source identity and archive admission
        run: node scripts/test-ide-vsix.mjs
      - name: Formatter evidence failure regressions
        run: node scripts/test-formatter-qualification.mjs
      - name: Formatter host qualification
        run: node scripts/qualify-formatter.mjs
      - name: Upload formatter host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovra-formatter-${{ matrix.os }}
          path: target/formatter/
          if-no-files-found: warn
      - name: Sovra language tests and report contract
        run: node scripts/test-language-tests.mjs
      - name: Relocated runtime payload offline native build
        if: matrix.os == 'windows-latest'
        run: node scripts/test-native-runtime-payload.mjs
      - name: Compiled desktop adapter through real Sovra execution
        if: matrix.os == 'windows-latest'
        run: node scripts/test-compiled-desktop.mjs
      - name: Native local-package linking and source-independent execution
        run: node scripts/test-native-packages.mjs
      - name: Native runtime errors and bounded file I/O
        run: node scripts/test-native-runtime.mjs
      - name: Native proof parity with a redirected Cargo target directory
        if: matrix.os != 'windows-latest'
        run: node scripts/test-native-task-manager.mjs
      - name: Build and install Windows toolchain
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Release compiler build failed' }
          node scripts/test-native-build-cli.mjs --compiler target/release/svr.exe
          if ($LASTEXITCODE -ne 0) { throw 'Optimized installed native acceptance failed' }
          New-Item -ItemType Directory -Path target\ide -Force | Out-Null
          $vsix = Join-Path $PWD 'target\ide\sovra-language.vsix'
          Push-Location toolchain\ide
          try {
            npx --yes @vscode/vsce@3.6.2 package --no-dependencies --out $vsix
            if ($LASTEXITCODE -ne 0) { throw 'VS Code extension packaging failed' }
          } finally { Pop-Location }
          .\scripts\build-windows-toolchain.ps1 -IdeExtension $vsix
          .\scripts\test-windows-toolchain.ps1 -Package target\toolchain\sovra-windows.zip
          .\scripts\test-doctor-package.ps1 -Package target\toolchain\sovra-windows
      - name: Native Task Manager executable parity
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          .\scripts\build-native-task-manager.ps1
          .\scripts\test-native-task-manager-artifact.ps1 -Package target\native-task-manager\sovra-task-manager.zip -ExtractTo target\native-task-manager\extracted
          node scripts/test-native-task-manager.mjs --native target\native-task-manager\extracted\sovra-task-manager\task-manager.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Task Manager parity failed' }
          node scripts/test-native-launcher.mjs target\native-task-manager\extracted\sovra-task-manager
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher acceptance failed' }
          .\scripts\build-desktop-ui.ps1 -Program target\native-task-manager\extracted\sovra-task-manager\task-manager.exe -Output target\desktop-ui\sovra-task-manager -AppId task-manager -GroupedLayout
          .\scripts\test-desktop-package.ps1 -PackageZIP target\desktop-ui\sovra-task-manager.zip -ExtractTo target\desktop-ui\verified
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts\test-desktop-ui.ps1 -TaskProgram target\desktop-ui\verified\sovra-task-manager\application.exe -Renderer target\desktop-ui\verified\sovra-task-manager\ui\renderer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Private desktop renderer acceptance failed' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts\test-desktop-responsive.ps1 -Renderer target\desktop-ui\verified\sovra-task-manager\ui\renderer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop responsiveness acceptance failed' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts\test-desktop-layout.ps1 -TaskProgram target\desktop-ui\verified\sovra-task-manager\application.exe -Renderer target\desktop-ui\verified\sovra-task-manager\ui\renderer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Grouped desktop layout acceptance failed' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts\test-desktop-accessibility.ps1 -TaskProgram target\desktop-ui\verified\sovra-task-manager\application.exe -Renderer target\desktop-ui\verified\sovra-task-manager\ui\renderer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop accessibility acceptance failed' }
          .\scripts\build-desktop-ui.ps1 -Program target\native-task-manager\extracted\sovra-task-manager\task-manager.exe -Output target\desktop-ui\sovra-task-manager-compiled -AppId task-manager -GroupedLayout -CompiledHost
          .\scripts\test-desktop-package.ps1 -PackageZIP target\desktop-ui\sovra-task-manager-compiled.zip -ExtractTo target\desktop-ui\compiled-verified -CompiledHost
          node scripts/test-compiled-desktop.mjs --package target\desktop-ui\compiled-verified\sovra-task-manager-compiled
          if ($LASTEXITCODE -ne 0) { throw 'Compiled desktop package acceptance failed' }
          cargo build --locked --example native_builder
          if ($LASTEXITCODE -ne 0) { throw 'Internal native builder build failed' }
          node scripts/test-native-builder-failures.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native builder failure isolation failed' }
      - name: Upload native Task Manager proof
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sovra-native-task-manager-proof
          path: |
            target/native-task-manager/sovra-task-manager.zip
            target/native-task-manager/sovra-task-manager.zip.sha256
      - name: Upload Windows toolchain
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sovra-windows-toolchain
          path: |
            target/toolchain/sovra-windows.zip
            target/toolchain/sovra-windows.zip.sha256
      - name: Upload private Windows desktop UI prototype
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sovra-windows-desktop-ui-private
          path: |
            target/desktop-ui/sovra-task-manager.zip
            target/desktop-ui/sovra-task-manager.zip.sha256
      - name: Upload compiled Windows desktop UI candidate
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sovra-windows-desktop-ui-compiled-private
          path: |
            target/desktop-ui/sovra-task-manager-compiled.zip
            target/desktop-ui/sovra-task-manager-compiled.zip.sha256
            target/compiled-desktop/verification.json
      - name: Dogfood application behavior (interpreter and JavaScript)
        run: node scripts/test-dogfood.mjs
      - name: Process input and streaming output parity
        run: node scripts/test-host-input.mjs
      - name: Text-file I/O parity
        run: node scripts/test-text-files.mjs
      - name: Conditional text-file replacement and mixed-engine conflicts
        run: node scripts/test-conditional-text-files.mjs
      - name: Task Manager persistence and corruption handling
        run: node scripts/test-task-persistence.mjs
      - name: Task Manager local browser GUI
        run: node scripts/test-task-gui.mjs
      - name: Reusable GUI execution bridge
        run: node scripts/test-gui-bridge.mjs
      - name: Sovra-owned UI component prototype
        run: node scripts/test-ui-prototype.mjs
      - name: Sovra grouped UI view parity
        run: node scripts/test-ui-layout-parity.mjs
      - name: Task Manager bounded pagination and long-text views
        run: node scripts/test-task-pagination.mjs
      - name: File Manager local browser dogfood
        run: node scripts/test-file-manager.mjs
      - name: Sovra Notes persistent storage dogfood
        run: node scripts/test-notes.mjs
      - name: Sovra HTTP Server loopback dogfood
        run: node scripts/test-sovra-http.mjs
      - name: Large integer text decoding parity
        run: node scripts/test-text-decoding.mjs
      - name: Executable runtime parity matrix
        run: node scripts/test-runtime-matrix.mjs
      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-${{ matrix.os }}
          path: target/dogfood/
          if-no-files-found: ignore
      - run: node scripts/probe-compiler-depth.mjs --assert-limits
      - run: node scripts/test-compiler-security.mjs
      - name: Upload exact-compiler depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-depth-${{ matrix.os }}
          path: target/depth-probe/results-*.json
          if-no-files-found: warn

  msrv:
    name: Minimum Rust 1.74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo check --locked --all-targets

  installed-toolchain:
    name: Downloaded Windows toolchain
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: sovra-windows-toolchain
          path: target/downloaded-toolchain
      - name: Verify and install downloaded toolchain
        shell: powershell
        run: .\scripts\test-windows-toolchain.ps1 -Package target\downloaded-toolchain\sovra-windows.zip

  downloaded-native:
    name: Downloaded standalone Task Manager
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sovra-native-task-manager-proof
          path: target/downloaded-native
      - name: Verify downloaded native application without developer tools
        shell: powershell
        run: .\scripts\test-downloaded-native.ps1 -Package target\downloaded-native\sovra-task-manager.zip -Report target\downloaded-native\verification.json
      - name: Reject damaged native downloads with failure evidence
        shell: powershell
        run: .\scripts\test-downloaded-native-failures.ps1 -Package target\downloaded-native\sovra-task-manager.zip
      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovra-downloaded-native-evidence
          path: target/downloaded-native/verification.json
          if-no-files-found: error

